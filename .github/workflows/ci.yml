# Peloton Communicator - unified CI pipeline
#
# Stages (each waits on the one before it):
#   1. Quality       - formatting and static analysis per component (fast feedback)
#   2. Build & Unit  - build + unit tests per component, in parallel
#   3. Integration   - real WebSocket signaling flows against the running server
#   4. Security      - CodeQL (SAST), govulncheck, gitleaks secret scan
#   5. CI Status     - single aggregate check; this is the required check on main
#
# Mobile end-to-end testing stays manual: headset buttons need physical devices.
# See docs/ci-pipeline.md for details and how to reproduce each gate locally.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**', 'chore/**', 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin toolchains explicitly. Deriving Flutter from pubspec's lower bound is what broke
  # the previous pipeline (it installed Flutter 3.16 / Dart 3.2 and pub get failed).
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.27.x'
  JAVA_VERSION: '17'
  SIGNALING_DIR: packages/services/signaling

jobs:
  # ==========================================================================
  # 1. QUALITY
  # ==========================================================================

  quality-mobile:
    name: Quality • mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

  quality-signaling:
    name: Quality • signaling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SIGNALING_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SIGNALING_DIR }}/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -s needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet (unit and integration build tags)
        run: go vet ./... && go vet -tags=integration ./...

  # ==========================================================================
  # 2. BUILD & UNIT (parallel per component)
  # ==========================================================================

  unit-mobile:
    name: Build & Unit • mobile
    runs-on: ubuntu-latest
    needs: quality-mobile
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mobile
          path: packages/mobile/coverage/lcov.info
          retention-days: 14

  build-android:
    name: Build & Unit • android
    runs-on: ubuntu-latest
    needs: quality-mobile
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the native Kotlin PTT layer (MediaSessionService, PttPlayer, ...),
      # which has no other automated coverage.
      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: Build & Unit • ios
    runs-on: macos-latest
    needs: quality-mobile
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compiles the Swift PTT layer (PushToTalk framework integration).
      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

  unit-signaling:
    name: Build & Unit • signaling
    runs-on: ubuntu-latest
    needs: quality-signaling
    defaults:
      run:
        working-directory: ${{ env.SIGNALING_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SIGNALING_DIR }}/go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-signaling
          path: ${{ env.SIGNALING_DIR }}/coverage.out
          retention-days: 14

      - name: Build container image
        run: docker build --tag signaling:ci .

  # ==========================================================================
  # 3. INTEGRATION
  # ==========================================================================

  integration-signaling:
    name: Integration • signaling
    runs-on: ubuntu-latest
    needs: unit-signaling
    defaults:
      run:
        working-directory: ${{ env.SIGNALING_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SIGNALING_DIR }}/go.sum

      - name: WebSocket signaling flows
        run: go test -race -count=1 -tags=integration -v ./cmd/...

  # ==========================================================================
  # 4. SECURITY
  # ==========================================================================

  codeql:
    name: Security • CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [unit-mobile, unit-signaling]
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.SIGNALING_DIR }}/go.sum

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.language == 'go'
        name: Build for analysis
        working-directory: ${{ env.SIGNALING_DIR }}
        run: go build ./...

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    name: Security • govulncheck
    runs-on: ubuntu-latest
    needs: unit-signaling
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          work-dir: ${{ env.SIGNALING_DIR }}

  secret-scan:
    name: Security • gitleaks
    runs-on: ubuntu-latest
    needs: [quality-mobile, quality-signaling]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Full-history scan with the pinned CLI so results don't depend on push ranges.
      # Reviewed, known-benign findings are listed in .gitleaksignore.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --exit-code 1 .

  # ==========================================================================
  # 5. AGGREGATE STATUS (required check on main)
  # ==========================================================================

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality-mobile
      - quality-signaling
      - unit-mobile
      - build-android
      - build-ios
      - unit-signaling
      - integration-signaling
      - codeql
      - govulncheck
      - secret-scan
    steps:
      - name: Require every gate to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::Gates not passing: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All gates passed."
