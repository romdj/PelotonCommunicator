name: Server CI/CD

on:
  push:
    branches: [main, dev]
    paths:
      - 'packages/server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/server/**'
      - '.github/workflows/server-ci.yml'

env:
  GO_VERSION: '1.21'

jobs:
  # ====================================
  # Code Quality and Testing
  # ====================================
  test:
    name: Test and Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/server/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        run: go test -v -tags=integration ./...

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v3
        with:
          file: packages/server/coverage.out
          flags: server
          name: server-coverage

  # ====================================
  # Security Scanning
  # ====================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest

      - name: Run gosec security scanner
        run: gosec ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        run: govulncheck ./...

  # ====================================
  # Build and Package
  # ====================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test, security]
    defaults:
      run:
        working-directory: packages/server

    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          BINARY_NAME="peloton-server"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          CGO_ENABLED=0 go build -a -installsuffix cgo -ldflags="-w -s" -o dist/${BINARY_NAME} .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/server/dist/

  # ====================================
  # Docker Build and Push
  # ====================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    defaults:
      run:
        working-directory: packages/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: peloton/communicator-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: packages/server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ====================================
  # Performance and Load Testing
  # ====================================
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: packages/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Build server for testing
        run: go build -o server .

      - name: Start server in background
        run: |
          ./server &
          echo $! > server.pid
          sleep 5  # Wait for server to start

      - name: Install k6 for load testing
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load tests
        run: |
          # Create a simple load test script
          cat << 'EOF' > loadtest.js
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export let options = {
            stages: [
              { duration: '2m', target: 100 },
              { duration: '5m', target: 100 },
              { duration: '2m', target: 200 },
              { duration: '5m', target: 200 },
              { duration: '2m', target: 0 },
            ],
          };

          export default function () {
            let response = http.get('http://localhost:8080/health');
            check(response, { 'status was 200': (r) => r.status == 200 });
            sleep(1);
          }
          EOF

          k6 run --quiet loadtest.js

      - name: Stop server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  # ====================================
  # API Documentation
  # ====================================
  docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: |
          if [ -f main.go ]; then
            swag init -g main.go --output docs/swagger
          fi

      - name: Upload API documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: api-documentation
          path: packages/server/docs/

  # ====================================
  # Deploy to Staging/Production
  # ====================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build, docker, performance]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.peloton-communicator.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add actual deployment logic here
          # This could be AWS ECS, Kubernetes, etc.

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Add smoke test logic here
          sleep 10
          curl -f https://staging-api.peloton-communicator.com/health || exit 1

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          # Add production deployment logic here

      - name: Verify production deployment
        run: |
          echo "✅ Verifying production deployment..."
          sleep 10
          curl -f https://api.peloton-communicator.com/health || exit 1

  # ====================================
  # Notification on Success/Failure
  # ====================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, security, build, docker, performance, deploy]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify on success
        if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && needs.docker.result == 'success' }}
        run: |
          echo "✅ Server CI/CD pipeline completed successfully!"
          # Add Slack/Discord notification here if needed

      - name: Notify on failure
        if: ${{ needs.test.result == 'failure' || needs.build.result == 'failure' || needs.docker.result == 'failure' }}
        run: |
          echo "❌ Server CI/CD pipeline failed!"
          # Add Slack/Discord notification here if needed