# Local development environment for Peloton Communicator MVP
# This compose file runs the signaling service for WebRTC peer coordination

version: '3.8'

services:
  # Signaling Service - WebSocket server for WebRTC peer coordination
  signaling:
    build:
      context: ../services/signaling
      dockerfile: Dockerfile
    container_name: peloton-signaling
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LOG_LEVEL=debug
      - LOG_JSON=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # TURN/STUN server for NAT traversal (optional - uses coturn)
