---
# Namespace for Peloton Communicator services
apiVersion: v1
kind: Namespace
metadata:
  name: peloton-communicator
  labels:
    app.kubernetes.io/name: peloton-communicator

---
# ConfigMap for signaling service configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: signaling-config
  namespace: peloton-communicator
  labels:
    app: signaling
data:
  HOST: "0.0.0.0"
  PORT: "8080"
  LOG_LEVEL: "info"
  LOG_JSON: "true"

---
# Deployment for the signaling service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signaling
  namespace: peloton-communicator
  labels:
    app: signaling
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signaling
  template:
    metadata:
      labels:
        app: signaling
    spec:
      containers:
        - name: signaling
          image: peloton-communicator/signaling:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: signaling-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - signaling
                topologyKey: kubernetes.io/hostname

---
# Service to expose the signaling deployment
apiVersion: v1
kind: Service
metadata:
  name: signaling
  namespace: peloton-communicator
  labels:
    app: signaling
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: signaling

---
# Ingress for external access (WebSocket support)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signaling-ingress
  namespace: peloton-communicator
  labels:
    app: signaling
  annotations:
    # Enable WebSocket support in ingress
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: signaling.peloton.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signaling
                port:
                  number: 8080
